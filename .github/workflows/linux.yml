name: Linux build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg yt-dlp libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libsecret-1-0 xvfb
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run lint
      - run: npm test
      - run: npm run dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Folder recovery and collapsed-video tests
        run: xvfb-run -a npx playwright test tests/e2e/library-folders.spec.ts
      - name: Packaged Linux smoke test
        run: xvfb-run -a node scripts/smoke-linux.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: orbe-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
