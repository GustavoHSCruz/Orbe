<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Orbe — Imagem de compartilhamento</title>
    <style>
      __BRAND_TOKENS__
      @font-face {
        font-family: 'Plus Jakarta Sans Variable';
        src: url('__FONT_URL__') format('woff2');
        font-style: normal;
        font-weight: 200 800;
      }
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; }
      body {
        background: var(--orbe-bg);
        color: var(--orbe-text);
        font-family: var(--orbe-font);
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; height: 100%; padding: 62px 72px 48px; position: relative; }
      .brand { display: flex; align-items: center; gap: 11px; }
      .brand img { width: 52px; height: 52px; }
      .brand span { font-size: 43px; line-height: 1; letter-spacing: -.04em; font-weight: 750; }
      h1 { margin: 81px 0 0; font-size: 77px; line-height: 1.13; letter-spacing: -.04em; font-weight: 650; }
      h1 span { color: var(--orbe-accent); }
      .orbit { position: absolute; width: 330px; height: 330px; right: 49px; top: 163px; }
      footer {
        position: absolute; bottom: 49px; left: 72px; right: 72px;
        display: flex; align-items: center; justify-content: space-between;
        border-top: 1px solid var(--orbe-border); padding-top: 25px;
      }
      footer p { margin: 0; color: var(--orbe-muted); font-size: 36px; font-weight: 450; }
      footer span { color: var(--orbe-text); font-size: 20px; font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><img src="__MARK_URL__" alt="" /><span>orbe</span></div>
      <h1>Sua coleção.<br /><span>Na sua órbita.</span></h1>
      <img class="orbit" src="__MARK_URL__" alt="Símbolo orbital coral do Orbe" />
      <footer><p>Músicas, vídeos e playlists.</p><span>useorbe.vercel.app</span></footer>
    </main>
  </body>
</html>
